workflows:
  ios-release:
    name: iOS Release with Safari Extension
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifiers:
          - com.h.k.portal
          - com.h.k.portal.extension
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install xcodeproj gem
        script: gem install xcodeproj
      - name: Inject Safari Extension Target & Sync Git
        script: |
          ruby ios/add_extension.rb
          git config user.name "Codemagic CI"
          git config user.email "ci@codemagic.io"
          git add ios/
          git commit -m "ci: Update RunnerExtension target in project.pbxproj [skip ci]" || true
          git push origin HEAD:$CM_BRANCH || true
      - name: Set up code signing for updated project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa